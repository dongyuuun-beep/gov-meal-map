name: Check official source connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check public source connections
        shell: bash
        run: |
          python3 - <<'PY'
          import sys,subprocess
          sys.path.insert(0,'scripts')
          from city_sources import SOURCES
          for city,(_,url) in SOURCES.items():
              result=subprocess.run(['curl','-4','-sSL','--connect-timeout','5','--max-time','10','-o','/dev/null','-w','HTTP=%{http_code} IP=%{remote_ip}',url],capture_output=True,text=True)
              print(city,'exit='+str(result.returncode),result.stdout,result.stderr.strip(),flush=True)
          PY
