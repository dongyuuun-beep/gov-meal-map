name: Monthly data refresh
on:
  schedule:
    - cron: '20 0 15 * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: monthly-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      retry_cities: ${{ steps.refresh.outputs.retry_cities }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: refresh
        uses: ./.github/actions/refresh
  recover:
    needs: collect
    if: always() && (needs.collect.result == 'failure' || needs.collect.outputs.retry_cities == 'true')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/refresh
  deploy:
    needs: [collect, recover]
    if: always() && ((needs.collect.result == 'success' && needs.recover.result == 'skipped') || needs.recover.result == 'success')
    uses: ./.github/workflows/deploy.yml
